name: CI Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify-admin-app:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run Automated Tests (Node + PGlite + Playwright)
        env:
          # Empty credentials ensure Playwright runs signed-out checks and skips live staging writes
          E2E_USER_EMAIL: ""
          E2E_USER_PASSWORD: ""
          E2E_ADMIN_EMAIL: ""
          E2E_ADMIN_PASSWORD: ""
        run: npm test

      - name: Verify Production Build
        env:
          # Dummy public placeholders if Next.js build validates env presence
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build
